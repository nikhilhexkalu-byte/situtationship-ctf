<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Situationship CTF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a1118;--pink:#ff4f87;--blush:#ffd6e4;--cream:#fff5ee;--sky:#ffb3c9;--gold:#ffc83d}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font:500 16px/1.55 "Zen Maru Gothic","Hiragino Maru Gothic ProN",system-ui,sans-serif;
 background:linear-gradient(#1b0b3a 0,#4a1f7a 28%,#a2428f 58%,#ff7aa5 82%,#ffc3a0 100%) fixed;overflow-x:hidden;cursor:default}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.22;
 background:radial-gradient(circle,#fff 1.3px,transparent 1.6px) 0 0/14px 14px;
 -webkit-mask-image:linear-gradient(#000,transparent 55%);mask-image:linear-gradient(#000,transparent 55%)}

/* anime scene */
#scene{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#scene .px{position:absolute;will-change:translate}
#stars{inset:-24px}
.star{position:absolute;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;scale:.5}}
.sp{position:absolute;color:#fff;text-shadow:0 0 8px #fff,0 0 16px #ffd6f0;animation:spk 3.4s ease-in-out infinite}
@keyframes spk{0%,100%{opacity:.2;scale:.6;rotate:0deg}50%{opacity:1;scale:1.2;rotate:45deg}}
.moon{right:9%;top:7%;width:clamp(110px,21vw,250px);aspect-ratio:1;border-radius:50%;
 background:radial-gradient(circle at 36% 34%,#fffdf0 0,#ffefb8 55%,#ffd88a 100%);
 box-shadow:0 0 50px 16px rgba(255,240,180,.55),0 0 150px 60px rgba(255,150,200,.35)}
.moon::before{content:"";position:absolute;inset:0;border-radius:50%;opacity:.5;
 background:radial-gradient(circle at 30% 62%,#e9c97c 0 9%,transparent 10%),radial-gradient(circle at 62% 30%,#e9c97c 0 6%,transparent 7%),radial-gradient(circle at 66% 68%,#e9c97c 0 11%,transparent 12%)}
.moon::after{content:"";position:absolute;inset:-40%;border-radius:50%;background:radial-gradient(circle,rgba(255,225,240,.4),transparent 62%);animation:halo 5s ease-in-out infinite}
@keyframes halo{50%{scale:1.15;opacity:.6}}
.cloud{position:absolute;height:44px;width:170px;border-radius:44px;background:rgba(255,236,246,.55);filter:blur(1px);animation:drift 120s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:inherit}
.cloud::before{width:70px;height:70px;left:24px;top:-34px}
.cloud::after{width:52px;height:52px;left:84px;top:-24px}
@keyframes drift{from{transform:translateX(-360px)}to{transform:translateX(calc(100vw + 360px))}}
.shoot{position:absolute;left:78%;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fff,rgba(255,255,255,0));opacity:0;box-shadow:0 0 8px #fff;animation:shoot 7s linear infinite}
@keyframes shoot{0%{transform:translate(0,0) rotate(-25deg);opacity:0}2%{opacity:1}11%{transform:translate(-520px,245px) rotate(-25deg);opacity:0}100%{opacity:0}}
.mist{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(transparent,rgba(255,130,180,.3))}
.skyline{position:absolute;bottom:0;left:-30px;width:calc(100% + 60px);height:clamp(150px,30vh,300px)}
.win{animation:wf 6s steps(1) infinite}
@keyframes wf{0%,90%{opacity:1}93%{opacity:.2}96%{opacity:1}}
.hh{font-size:22px;fill:#ff6fa5;opacity:0;animation:hh 5s ease-in infinite}
@keyframes hh{0%{translate:0 0;opacity:0}15%{opacity:.95}100%{translate:10px -120px;opacity:0}}
.dot{animation:dt 1.4s infinite}
@keyframes dt{0%,100%{opacity:.25}50%{opacity:1}}
.ph{filter:drop-shadow(0 0 6px #8ff)}
.pony{transform-box:fill-box;transform-origin:right center;animation:sway 2.6s ease-in-out infinite}
@keyframes sway{50%{rotate:-8deg}}
#petals{position:fixed;inset:0;pointer-events:none;z-index:1}
.wrap{position:relative;z-index:2;max-width:980px;margin:0 auto;padding:26px 18px 140px}
.sfx{font-family:Bangers,Impact,sans-serif;letter-spacing:2px}

/* hero */
.hero{position:relative;padding:34px 10px 26px;text-align:center;isolation:isolate}
.hero::before{content:"";position:absolute;left:50%;top:50%;width:900px;height:900px;transform:translate(-50%,-50%);z-index:-1;
 background:repeating-conic-gradient(from 0deg,#fff 0 4deg,transparent 4deg 9deg);opacity:.7;border-radius:50%;
 -webkit-mask-image:radial-gradient(circle,transparent 18%,#000 62%,transparent 70%);mask-image:radial-gradient(circle,transparent 18%,#000 62%,transparent 70%);
 animation:spin 90s linear infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.doki{position:absolute;font-size:32px;color:var(--pink);-webkit-text-stroke:1.5px var(--ink);transform:rotate(-10deg);animation:beat 1.1s infinite}
.doki.l{left:2%;top:18%}.doki.r{right:2%;top:56%;transform:rotate(9deg);animation-delay:.5s}
@keyframes beat{0%,100%{scale:1}15%{scale:1.25}30%{scale:1}45%{scale:1.18}}
h1{margin:0;font:400 clamp(48px,11vw,112px)/.88 Bangers,Impact,sans-serif;letter-spacing:2px;color:#fff;
 -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--pink),9px 9px 0 var(--ink)}
h1 em{display:block;color:var(--pink);font-style:normal;transform:rotate(-2deg)}
.sub{display:inline-block;margin-top:26px;background:#fff;border:3px solid var(--ink);padding:10px 18px;border-radius:18px;font-weight:700;font-size:15px;max-width:540px;position:relative}
.sub::before{content:"";position:absolute;top:-14px;left:50%;width:20px;height:20px;background:#fff;border:3px solid var(--ink);border-width:3px 0 0 3px;transform:translateX(-50%) rotate(45deg)}

/* status bar */
.bar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:32px 0 34px;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;box-shadow:6px 6px 0 var(--pink)}
.bar label{font:400 20px Bangers,sans-serif;letter-spacing:1.5px;color:var(--gold)}
.bar input{background:#fff;border:0;border-radius:8px;padding:7px 10px;font:700 15px inherit;width:170px;color:var(--ink)}
.bar input:focus{outline:3px solid var(--pink)}
.meter{flex:1;min-width:180px}
.meter small{font:400 15px Bangers,sans-serif;letter-spacing:1.5px;display:flex;justify-content:space-between}
.track{height:16px;border:2px solid #fff;border-radius:99px;overflow:hidden;background:#3a2a35}
.fill{height:100%;width:0;background:repeating-linear-gradient(115deg,var(--pink) 0 10px,#ff7aa5 10px 20px);transition:width .8s cubic-bezier(.2,1.4,.4,1);animation:slide 1s linear infinite;background-size:200% 100%}
@keyframes slide{to{background-position:28px 0}}

/* panels */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:30px 26px}
.card{position:relative;background:#fff;border:3.5px solid var(--ink);border-radius:6px;padding:18px 16px 16px;
 box-shadow:7px 7px 0 var(--pink);transition:transform .2s,box-shadow .2s;overflow:hidden}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;opacity:.5;pointer-events:none;
 background:radial-gradient(circle,var(--pink) 2px,transparent 2.4px) 0 0/9px 9px}
.card:nth-child(3n+1){transform:rotate(-.9deg)}.card:nth-child(3n+2){transform:rotate(.7deg)}.card:nth-child(3n){transform:rotate(-.3deg)}
.card:hover{transform:translate(-4px,-6px) rotate(0);box-shadow:11px 13px 0 var(--ink)}
.no{display:inline-block;background:var(--ink);color:#fff;font:400 18px Bangers,sans-serif;letter-spacing:1px;padding:0 9px;transform:skew(-10deg)}
.tag{float:right;font:700 11px inherit;letter-spacing:1px;text-transform:uppercase;border:2px solid var(--ink);border-radius:99px;padding:1px 9px;background:var(--blush);position:relative;z-index:1}
.card h3{font:900 22px/1.2 inherit;margin:12px 0 6px;position:relative;z-index:1}
.card p{margin:0 0 12px;font-size:14.5px;position:relative;z-index:1}
.go{display:inline-block;font:700 13px inherit;color:var(--ink);background:var(--gold);border:2.5px solid var(--ink);border-radius:8px;padding:3px 11px;text-decoration:none;box-shadow:3px 3px 0 var(--ink);position:relative;z-index:1}
.go:hover{translate:-1px -1px;box-shadow:5px 5px 0 var(--ink)}
.row{display:flex;gap:7px;margin-top:14px;position:relative;z-index:1}
.row input{flex:1;min-width:0;border:2.5px solid var(--ink);border-radius:8px;padding:7px 9px;font:700 13px "Courier New",monospace;background:var(--cream)}
.row input:focus{outline:3px solid var(--blush);border-color:var(--pink)}
button{font:400 18px Bangers,sans-serif;letter-spacing:1px;background:var(--pink);color:#fff;border:2.5px solid var(--ink);border-radius:8px;padding:2px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.msg{font:700 12px "Courier New",monospace;min-height:16px;margin-top:7px;position:relative;z-index:1}
.card.done{background:#fff0f5}
.card.done::before{content:"MATCH♥";position:absolute;right:10px;bottom:10px;z-index:2;font:400 28px Bangers,sans-serif;letter-spacing:2px;color:var(--pink);
 -webkit-text-stroke:1.5px var(--ink);transform:rotate(-8deg);animation:stamp .5s cubic-bezier(.2,2,.4,1)}
@keyframes stamp{from{scale:3;opacity:0}}
.shake{animation:shake .4s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}

h2{font:400 clamp(34px,6vw,52px) Bangers,sans-serif;letter-spacing:2px;margin:70px 0 14px;color:#fff;-webkit-text-stroke:2.5px var(--ink);paint-order:stroke fill;text-shadow:4px 4px 0 var(--pink)}
.rank{background:#fff;border:3.5px solid var(--ink);border-radius:6px;box-shadow:7px 7px 0 var(--ink)}
.rank div{display:grid;grid-template-columns:44px 1fr 70px 70px;gap:8px;padding:9px 16px;border-bottom:2px dashed #e5b7c6;font-weight:700;align-items:center}
.rank div:last-child{border:0}
.rank .n{font:400 24px Bangers,sans-serif;color:var(--pink)}
.rank div:first-child .n::after{content:" ♛";color:var(--gold);-webkit-text-stroke:1px var(--ink)}
footer{margin-top:50px;text-align:center;font-weight:700;font-size:13px;color:#fff;opacity:.85;text-shadow:0 1px 6px rgba(26,11,58,.8)}

/* narrator */
#nar{position:fixed;left:14px;bottom:14px;z-index:20;max-width:min(330px,calc(100vw - 28px));display:flex;gap:10px;align-items:flex-end;pointer-events:none}
#nar .face{flex:none;width:64px;height:64px;border-radius:50%;background:var(--blush);border:3.5px solid var(--ink);overflow:hidden;box-shadow:3px 3px 0 var(--ink);animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{translate:0 -4px}}
#nar .face svg{display:block;width:100%;height:100%}
#nar .eyes{transform-origin:28px 34px;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#nar .b{background:#fff;border:3px solid var(--ink);border-radius:16px 16px 16px 2px;padding:8px 13px;font-weight:700;font-size:13.5px;box-shadow:4px 4px 0 var(--ink);animation:pop .3s cubic-bezier(.2,2,.4,1)}
@keyframes pop{from{scale:.6;opacity:0}}
.fx{position:fixed;z-index:50;pointer-events:none;font-weight:900;color:var(--pink);-webkit-text-stroke:1px var(--ink);user-select:none}
@media(max-width:600px){.doki{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div id="scene" aria-hidden="true">
 <div class="px" id="stars" data-d="-8"></div>
 <div class="px moon" data-d="-18"></div>
 <div class="px" data-d="-10" style="inset:0">
  <div class="cloud" style="top:12%;animation-duration:140s;animation-delay:-40s"></div>
  <div class="cloud" style="top:26%;width:130px;opacity:.7;animation-duration:105s;animation-delay:-80s"></div>
  <div class="cloud" style="top:38%;width:200px;opacity:.5;animation-duration:170s;animation-delay:-10s"></div>
 </div>
 <div class="shoot" style="top:6%"></div>
 <div class="shoot" style="top:18%;left:92%;animation-delay:3.6s;animation-duration:9s"></div>
 <div class="mist"></div>
 <svg class="px skyline" id="cityB" data-d="6" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice"></svg>
 <svg class="px skyline" id="cityF" data-d="14" viewBox="0 0 1600 300" preserveAspectRatio="xMidYMax slice"></svg>
 <svg class="px skyline" data-d="22" viewBox="0 0 1600 300" preserveAspectRatio="xMaxYMax slice">
  <rect x="0" y="262" width="1600" height="40" fill="#120720"/>
  <rect x="0" y="259" width="1600" height="4" fill="#3a1a5c"/>
  <!-- she is typing... -->
  <g>
   <rect x="1286" y="160" width="46" height="24" rx="12" fill="#fff" opacity=".92"/>
   <path d="M1312 184l6 8-12-3z" fill="#fff" opacity=".92"/>
   <circle class="dot" cx="1299" cy="172" r="3" fill="#ff4f87"/>
   <circle class="dot" cx="1309" cy="172" r="3" fill="#ff4f87" style="animation-delay:.25s"/>
   <circle class="dot" cx="1319" cy="172" r="3" fill="#ff4f87" style="animation-delay:.5s"/>
  </g>
  <!-- her -->
  <path class="pony" d="M1318 205q-34-8-56 10q26 0 44 17z" fill="#120720"/>
  <circle cx="1330" cy="212" r="14" fill="#120720"/>
  <path d="M1316 226q14-7 28 0l7 36h-42z" fill="#120720"/>
  <rect class="ph" x="1346" y="238" width="8" height="12" rx="2" fill="#bff"/>
  <!-- him -->
  <path d="M1485 206l5-15 5 10 6-13 5 11 8-9-1 16z" fill="#120720"/>
  <circle cx="1500" cy="212" r="15" fill="#120720"/>
  <path d="M1484 228q16-7 32 0l5 34h-42z" fill="#120720"/>
  <rect class="ph" x="1474" y="240" width="8" height="12" rx="2" fill="#bff"/>
  <!-- the gap between them -->
  <text class="hh" x="1405" y="238">♥</text>
  <text class="hh" x="1420" y="238" style="animation-delay:1.7s">♥</text>
  <text class="hh" x="1412" y="238" style="animation-delay:3.4s">♡</text>
 </svg>
</div>
<canvas id="petals"></canvas>
<div class="wrap">
 <header class="hero">
  <span class="doki l sfx">ドキ</span><span class="doki r sfx">ドキ</span>
  <h1>Situationship<em>CTF</em></h1>
  <div class="sub">Six hearts to win. Everyone here is emotionally unavailable, but their APIs are wide open. Flags look like <b>ctf{...}</b></div>
 </header>
 <div class="bar">
  <label for="nick">YOUR NAME</label><input id="nick" maxlength="20" placeholder="senpai?" autocomplete="off">
  <div class="meter"><small><span>LOVE METER</span><span id="score">0/0</span></small><div class="track"><div class="fill" id="fill"></div></div></div>
 </div>
 <div class="grid" id="grid"></div>
 <h2>Hall of Hearts</h2>
 <div class="rank" id="board"></div>
 <footer>Scores reset when the server naps. Be kind to the heartbroken server.</footer>
</div>
<div id="nar"><div class="face"><svg viewBox="0 0 56 56" aria-hidden="true">
 <path d="M7 34C5 6 51 6 49 34L47 56H9z" fill="#3b1c6e"/>
 <circle cx="28" cy="31" r="19" fill="#ffe6d8"/>
 <path d="M9 31C8 12 48 12 47 31 42 23 36 21 33 25 30 20 22 21 20 26 16 21 12 25 9 31z" fill="#3b1c6e"/>
 <path d="M28 14q-5-9 3-11-5 5 1 11" fill="none" stroke="#3b1c6e" stroke-width="2" stroke-linecap="round"/>
 <g class="eyes"><ellipse cx="21" cy="35" rx="3.8" ry="5.2" fill="#2a1346"/><ellipse cx="35" cy="35" rx="3.8" ry="5.2" fill="#2a1346"/>
  <circle cx="22.3" cy="33" r="1.7" fill="#fff"/><circle cx="36.3" cy="33" r="1.7" fill="#fff"/><circle cx="20" cy="37" r=".8" fill="#fff"/><circle cx="34" cy="37" r=".8" fill="#fff"/></g>
 <ellipse cx="14.5" cy="42" rx="3.2" ry="1.7" fill="#ff9fbd" opacity=".75"/><ellipse cx="41.5" cy="42" rx="3.2" ry="1.7" fill="#ff9fbd" opacity=".75"/>
 <path d="M25 45q3 3 6 0" fill="none" stroke="#c0446e" stroke-width="1.5" stroke-linecap="round"/>
</svg></div><div class="b" id="say">Oh... you came. Pick a name and find your match.</div></div>
<script>
const $=s=>document.querySelector(s),RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const nick=$('#nick');nick.value=localStorage.getItem('nick')||'';
let chs=[],done=JSON.parse(localStorage.getItem('done')||'{}'),st;
const say=t=>{const b=$('#say');b.style.animation='none';b.offsetWidth;b.style.animation='';b.textContent=t;clearTimeout(st);st=setTimeout(()=>b.textContent=idle[Math.random()*idle.length|0],9000)};
const idle=['Try view-source. I won\'t tell anyone.','Cookies are a love language.','robots.txt has feelings too.','Hex is just numbers with trust issues.','Don\'t give up. Ghosting is temporary.'];
nick.oninput=()=>{localStorage.setItem('nick',nick.value);paint()};
const mine=()=>done[nick.value]||[];

function paint(){
 const m=mine();$('#score').textContent=m.length+'/'+chs.length;
 $('#fill').style.width=(chs.length?m.length/chs.length*100:0)+'%';
 $('#grid').innerHTML=chs.map((c,i)=>`<div class="card ${m.includes(c.id)?'done':''}" id="c-${c.id}">
  <span class="no">CH.0${i+1}</span><span class="tag">${c.cat} · ${c.pts}pt</span>
  <h3>${c.title}</h3><p>${c.desc}</p><a class="go" href="${c.link}" target="_blank">Investigate →</a>
  <div class="row"><input id="f-${c.id}" placeholder="ctf{...}" autocomplete="off"><button data-id="${c.id}">SEND</button></div>
  <div class="msg" id="m-${c.id}"></div></div>`).join('');
}

function burst(x,y,chars,n){
 if(RM)return;
 for(let i=0;i<n;i++){
  const e=document.createElement('span');e.className='fx';e.textContent=chars[i%chars.length];
  e.style.cssText+=`left:${x}px;top:${y}px;font-size:${14+Math.random()*22}px`;document.body.appendChild(e);
  const a=Math.random()*Math.PI*2,d=70+Math.random()*170;
  e.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+90}px) rotate(${Math.random()*360}deg) scale(1)`,opacity:0}],
   {duration:900+Math.random()*700,easing:'cubic-bezier(.1,.7,.3,1)'}).onfinish=()=>e.remove();
 }
}
$('#grid').onclick=async e=>{
 const id=e.target.dataset.id;if(!id)return;
 const r=await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({nick:nick.value,id,flag:$('#f-'+id).value})}).then(r=>r.json());
 const m=$('#m-'+id),card=$('#c-'+id),b=e.target.getBoundingClientRect();
 if(r.ok&&!/Already/.test(r.msg)){
  const k=nick.value;done[k]=[...new Set([...(done[k]||[]),id])];localStorage.setItem('done',JSON.stringify(done));
  burst(b.left+b.width/2,b.top,['♥','✦','♡','❀'],34);paint();board();
  say(mine().length===chs.length?'All six?! ...Okay. I\'m yours. ♥':'Kyaa! You got it! +'+chs.find(c=>c.id===id).pts);
 }else if(!r.ok){
  card.classList.remove('shake');card.offsetWidth;card.classList.add('shake');burst(b.left+b.width/2,b.top,['💔'],5);
  say(r.msg==='Nope. Ghosted.'?'Ghosted... but don\'t stop now.':r.msg);
 }
 if(m)m.textContent=r.msg;
};
async function board(){
 const b=await fetch('/api/board').then(r=>r.json());
 $('#board').innerHTML=b.length?b.map((x,i)=>`<div><span class="n">${i+1}</span><span>${x.nick.replace(/</g,'&lt;')}</span><span>${x.solved} ♥</span><span>${x.pts}</span></div>`).join('')
  :'<div><span class="n">-</span><span>Nobody yet. The seat next to you is empty.</span><span></span><span></span></div>';
}

/* sakura */
const cv=$('#petals'),cx=cv.getContext('2d');let W,H,P=[],mx=0;
const size=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};size();addEventListener('resize',size);
for(let i=0;i<(RM?0:42);i++)P.push({x:Math.random()*W,y:Math.random()*H,s:6+Math.random()*9,v:.5+Math.random()*1.2,w:Math.random()*6,r:Math.random()*6,c:Math.random()>.5?'#ff9fbd':'#ffc2d6'});
addEventListener('mousemove',e=>mx=(e.clientX/W-.5)*2);
(function loop(t){
 cx.clearRect(0,0,W,H);
 for(const p of P){
  p.y+=p.v;p.x+=Math.sin(p.w+t/1400)*.8+mx*.6;p.r+=.02;
  if(p.y>H+20){p.y=-20;p.x=Math.random()*W}
  cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.scale(1,.55+Math.abs(Math.sin(p.r*1.5))*.45);
  cx.fillStyle=p.c;cx.beginPath();cx.moveTo(0,-p.s);cx.bezierCurveTo(p.s,-p.s,p.s,p.s*.6,0,p.s);cx.bezierCurveTo(-p.s,p.s*.6,-p.s,-p.s,0,-p.s);cx.fill();cx.restore();
 }
 requestAnimationFrame(loop);
})(0);

/* heart trail */
let last=0;
addEventListener('mousemove',e=>{
 const n=performance.now();if(RM||n-last<70)return;last=n;
 const h=document.createElement('span');h.className='fx';h.textContent='♥';

/* anime scene */
(function(){
 const R=Math.random;
 let h='';
 for(let i=0;i<110;i++){const s=1+R()*2;h+=`<div class="star" style="left:${R()*100}%;top:${R()*64}%;width:${s}px;height:${s}px;animation-duration:${2+R()*3}s;animation-delay:-${R()*5}s"></div>`}
 for(let i=0;i<9;i++){h+=`<span class="sp" style="left:${R()*100}%;top:${R()*50}%;font-size:${11+R()*10}px;animation-delay:-${R()*4}s">✦</span>`}
 $('#stars').innerHTML=h;
 function city(el,fill,op,win,minH,varH){
  let x=-10,s='';
  while(x<1620){
   const w=44+R()*70|0,ht=minH+R()*varH|0;
   s+=`<rect x="${x}" y="${300-ht}" width="${w+1}" height="${ht}" fill="${fill}" opacity="${op}"/>`;
   if(R()<.25)s+=`<rect x="${x+w/2|0}" y="${300-ht-18}" width="2" height="18" fill="${fill}" opacity="${op}"/>`;
   if(win)for(let wy=300-ht+14;wy<286;wy+=20)for(let wx=x+8;wx<x+w-10;wx+=14)
    if(R()<.3)s+=`<rect class="win" style="animation-delay:-${(R()*6).toFixed(1)}s" x="${wx}" y="${wy}" width="5" height="7" fill="#ffd98a"/>`;
   x+=w;
  }
  el.innerHTML=s;
 }
 city($('#cityB'),'#6b3a98',.75,false,110,140);
 city($('#cityF'),'#26103f',1,true,70,140);
 if(!RM){
  const px=[...document.querySelectorAll('.px')];let tx=0,ty=0,cx0=0,cy0=0;
  addEventListener('mousemove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
  (function par(){cx0+=(tx-cx0)*.06;cy0+=(ty-cy0)*.06;
   px.forEach(el=>{const d=+el.dataset.d;el.style.translate=`${cx0*d}px ${cy0*d*.6}px`});
   requestAnimationFrame(par)})();
 }
})();
